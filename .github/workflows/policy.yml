name: policy
on: pull_request
permissions: { contents: read, pull-requests: write, checks: write }

env:
  SG_API_TOKEN: ${{ secrets.SG_API_TOKEN }}
  SG_ORG: ${{ vars.SG_ORG }}
  SG_API_URL: https://testapi.qa.stackguardian.io/api/v1
  SG_DASH: https://dash.qa.stackguardian.io
  # QA-only: the template lives under demo-org because the apikey cannot write to /stackguardian,
  # which is where the built-in default points.
  SG_STEP_TEMPLATE: /demo-org/tirith-iac-governance:1

jobs:
  # Case 1 — the ordinary plan run. Source uploaded by default, plan masked client-side, infracost
  # generated, org policies evaluated, sticky comment written.
  #
  # Also the failing-policy case: the plan trips a policy, so the verdict is `failed` while the RUN
  # must still reach COMPLETED. A policy violation is data, not a step failure.
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        continue-on-error: true   # the plan violates policy on purpose; the assertion below is the test
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          step-template-id: ${{ env.SG_STEP_TEMPLATE }}
          workflow-id: e2e-ntn-plan
          comment-tag: plan
          # Defaults to false, where a failing policy sets a failing check run but exits 0 and the job
          # stays green. Turning it on is the gating configuration, and the exit-3 path worth testing.
          fail-on-error: "true"
      - if: always()
        run: echo "PLAN verdict=${{ steps.tirith.outputs.verdict }} run=${{ steps.tirith.outputs.wfrun-id }} mode=${{ steps.tirith.outputs.mode }}"

      - name: a violated policy must fail the step, and the RUN must still complete
        env:
          TOKEN: ${{ secrets.SG_API_TOKEN }}
        run: |
          set -euo pipefail
          test "${{ steps.tirith.outputs.verdict }}" = "failed" || { echo "expected a failed verdict"; exit 1; }
          test "${{ steps.tirith.outcome }}" = "failure" || { echo "a failed policy must gate the PR"; exit 1; }
          # The distinction that matters: the policy failed, the platform did not. Exit 12 keeps the
          # run COMPLETED so a violation never looks like an outage.
          STATUS=$(curl -sf -H "Authorization: apikey $TOKEN" \
            "${{ env.SG_API_URL }}/orgs/${{ env.SG_ORG }}/wfgrps/default/wfs/e2e-ntn-plan/wfruns/${{ steps.tirith.outputs.wfrun-id }}/" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["msg"]["LatestStatus"])')
          echo "run status: $STATUS"
          test "$STATUS" = "COMPLETED" || { echo "a policy failure marked the run $STATUS -- it must be COMPLETED"; exit 1; }
          echo "OK: policy failed, PR gated, run COMPLETED"

      # Masking, asserted against the bytes that actually left the runner rather than against a dict
      # in a unit test. plan.json here is BOTH the policy input and a file in the source tree, so the
      # masked copy must be at the archive root AND the unmasked original must not have been packed
      # alongside it. That is the exact mistake the source walk exists to prevent.
      - name: the uploaded bundle must carry no plaintext secret
        if: always()
        env:
          TOKEN: ${{ secrets.SG_API_TOKEN }}
          RUN_ID: ${{ steps.tirith.outputs.wfrun-id }}
          BASE: ${{ env.SG_API_URL }}/orgs/${{ env.SG_ORG }}/wfgrps/default/wfs/e2e-ntn-plan
        run: |
          set -euo pipefail
          # Resolve the bundle from the RUN rather than guessing its name. Under pull_request the
          # workspace HEAD is the merge commit, not the head sha the action names the bundle after --
          # and this is also the documented path a consumer walks: run -> bundlePath -> get_artifact.
          BUNDLE=$(curl -sf -H "Authorization: apikey $TOKEN" "$BASE/wfruns/$RUN_ID/" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["msg"]; print(next(s["wfStepInputData"]["data"]["bundlePath"] for s in d["RuntimeParameters"]["wfStepsConfig"] if (s.get("wfStepInputData") or {}).get("data",{}).get("bundlePath")))')
          echo "run $RUN_ID evaluated bundle: $BUNDLE"
          test -n "$BUNDLE" || { echo "the run names no bundle"; exit 1; }

          URL=$(curl -sf -H "Authorization: apikey $TOKEN" \
            "$BASE/get_artifact/?artifactPath=$BUNDLE" \
            | python3 -c 'import json,sys; print((json.load(sys.stdin).get("data") or {}).get("signedUrl",""))')
          test -n "$URL" || { echo "no signed URL -- the bundle was not retained"; exit 1; }
          curl -sf "$URL" -o bundle.tar.gz
          mkdir -p unpacked && tar -xzf bundle.tar.gz -C unpacked
          echo "--- bundle contents ---"; find unpacked -type f | sort

          # 1. The DOCUMENTS must be masked. plan.json here is also a file in the source tree, so this
          #    also proves the source walk excluded the unmasked original rather than packing it
          #    one filename away from the redacted copy.
          if grep -q "hunter2-plan-secret" unpacked/plan.json; then
            echo "PLAINTEXT SECRET IN THE MASKED DOCUMENT -- this is a leak"; exit 1
          fi
          grep -q "__SG_REDACTED__" unpacked/plan.json || { echo "plan.json carries no redaction marker"; exit 1; }

          # 2. Committed SOURCE ships as written -- documented, deliberate, and worth pinning so a
          #    change in either direction is noticed. A secret hardcoded in HCL does reach the
          #    platform; `source-dir: ""` is the opt-out.
          test -f unpacked/main.tf || { echo "the source was not packed"; exit 1; }
          grep -q "hunter2-plan-secret" unpacked/main.tf || {
            echo "main.tf no longer ships its literal -- the documented caveat has changed, update the docs"
            exit 1
          }

          echo "OK: documents masked, source shipped verbatim as documented, bundle retained"

  # Case 2 — a BINARY plan. `plan-file` renders it through `terraform show -json` in memory, so no
  # unmasked plan JSON is ever written to disk. This is the case a pre-baked plan.json cannot test.
  plan-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - run: |
          terraform init -no-color
          terraform plan -out=tfplan.bin -no-color
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          step-template-id: ${{ env.SG_STEP_TEMPLATE }}
          plan-file: tfplan.bin
          workflow-id: e2e-ntn-planfile
          comment-tag: plan-file
      - if: always()
        run: echo "PLANFILE verdict=${{ steps.tirith.outputs.verdict }} run=${{ steps.tirith.outputs.wfrun-id }}"
      - name: the rendered plan JSON must never have touched the disk
        if: always()
        run: |
          test -f tfplan.bin || { echo "binary plan vanished"; exit 1; }
          # plan.json and state.json are committed fixtures, so the check is that `plan-file`
          # rendering produced no NEW json -- it goes through terraform show into memory.
          for unexpected in tfplan.json plan-file.json tfplan.bin.json; do
            test ! -f "$unexpected" || { echo "UNEXPECTED $unexpected written to disk"; exit 1; }
          done
          # And the committed plan.json must be byte-identical -- the run must not have overwritten it.
          git diff --exit-code -- plan.json || { echo "plan.json was modified on disk"; exit 1; }
          echo "no rendered plan JSON was written to disk"

  # Case 3 — a state document. Routing is purely "no plan.json, so tfstate.json goes to the json
  # provider"; there is no stored input kind to disagree with.
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          step-template-id: ${{ env.SG_STEP_TEMPLATE }}
          input-kind: terraform_state
          state-path: state.json
          source-dir: ""
          workflow-id: e2e-ntn-state
          comment-tag: state
      - if: always()
        run: echo "STATE verdict=${{ steps.tirith.outputs.verdict }} run=${{ steps.tirith.outputs.wfrun-id }}"

  # Case 4 — the two-phase pipeline. Same workflow-id as the plan job, so the workflow already
  # exists: exactly the shape where ensure_workflow returns 409 and updates nothing. A state document
  # must still route correctly against a workflow the plan phase created.
  two-phase:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          step-template-id: ${{ env.SG_STEP_TEMPLATE }}
          input-kind: terraform_state
          state-path: state.json
          source-dir: ""
          workflow-id: e2e-ntn-plan
          comment-tag: two-phase
      - if: always()
        run: echo "TWOPHASE verdict=${{ steps.tirith.outputs.verdict }} run=${{ steps.tirith.outputs.wfrun-id }}"

  # Case 5 — credential-free local mode. Policies come from the repository; nothing leaves the
  # runner. Coexists with the platform jobs on the same PR, with its own comment tag.
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        env:
          SG_API_TOKEN: ""
          SG_ORG: ""
        with:
          comment-tag: local
      - if: always()
        run: echo "LOCAL verdict=${{ steps.tirith.outputs.verdict }} mode=${{ steps.tirith.outputs.mode }}"
      - name: local mode must report no run id
        if: always()
        run: |
          test -z "${{ steps.tirith.outputs.wfrun-id }}" || { echo "local mode leaked a run id"; exit 1; }
          echo "wfrun-id is unset, as documented"

  # Case 6 — defaults. `workflow-group` is omitted entirely, so the run must land in `default`; the
  # run URL is the evidence, since that is what a user follows from the PR comment.
  defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          step-template-id: ${{ env.SG_STEP_TEMPLATE }}
          workflow-id: e2e-ntn-defaults
          comment-tag: defaults
      - if: always()
        run: echo "DEFAULTS verdict=${{ steps.tirith.outputs.verdict }} url=${{ steps.tirith.outputs.wfrun-url }}"
      - name: the run must be in the default workflow group
        run: |
          URL="${{ steps.tirith.outputs.wfrun-url }}"
          echo "$URL"
          case "$URL" in
            */wfgrps/default/*) echo "landed in the default workflow group" ;;
            *) echo "expected /wfgrps/default/ in the run URL"; exit 1 ;;
          esac

      # The step's stage name, which is what the dashboard shows and what every status key is built
      # from. Renamed from `evaluate-policies` so the stage names the template that produced it.
      - name: the run stage must be named after the step template
        env:
          TOKEN: ${{ secrets.SG_API_TOKEN }}
        run: |
          set -euo pipefail
          STAGES=$(curl -sf -H "Authorization: apikey $TOKEN" \
            "${{ env.SG_API_URL }}/orgs/${{ env.SG_ORG }}/wfgrps/default/wfs/e2e-ntn-defaults/wfruns/${{ steps.tirith.outputs.wfrun-id }}/" \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["msg"]["Statuses"].keys()))')
          echo "stages: $STAGES"
          case "$STAGES" in
            *tirith-iac-governance*) echo "stage is named tirith-iac-governance" ;;
            *) echo "expected a tirith-iac-governance stage, got: $STAGES"; exit 1 ;;
          esac

  # Case 7 — infracost. The plan carries a t3.micro and a db.t3.micro, so a working estimate is a real
  # number. A zero here means infracost could not price the plan, and a cost policy comparing a
  # threshold against that zero would pass for the wrong reason.
  infracost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          step-template-id: ${{ env.SG_STEP_TEMPLATE }}
          workflow-id: e2e-ntn-infracost
          comment-tag: infracost
      - if: always()
        run: echo "INFRACOST verdict=${{ steps.tirith.outputs.verdict }} run=${{ steps.tirith.outputs.wfrun-id }}"
      - name: the cost estimate must be a real number
        env:
          TOKEN: ${{ secrets.SG_API_TOKEN }}
          BASE: ${{ env.SG_API_URL }}/orgs/${{ env.SG_ORG }}/wfgrps/default/wfs/e2e-ntn-infracost
        run: |
          set -euo pipefail
          URL=$(curl -sf -H "Authorization: apikey $TOKEN" \
            "$BASE/wfruns/${{ steps.tirith.outputs.wfrun-id }}/wfrunfacts/default/" \
            | python3 -c 'import json,sys; m=json.load(sys.stdin).get("msg") or {}; print(m.get("signed_url","") if isinstance(m,dict) else "")')
          test -n "$URL" || { echo "no facts document"; exit 1; }
          curl -sf "$URL" -o facts.json
          python3 - <<'EOF'
          import json, sys
          facts = json.load(open("facts.json"))
          ib = facts.get("InfracostBreakdown") or {}
          total = ib.get("totalMonthlyCost")
          print("totalMonthlyCost:", total)
          for p in ib.get("projects") or []:
              for r in (p.get("breakdown") or {}).get("resources") or []:
                  print("   ", r.get("name"), "->", r.get("monthlyCost"))
          if total is None:
              sys.exit("no InfracostBreakdown -- infracost did not run, or could not price the plan")
          if float(total) <= 0:
              sys.exit("cost is 0 for a plan with a t3.micro and a db.t3.micro -- pricing failed, and a "
                       "cost policy would pass against this zero for the wrong reason")
          print("OK: infracost produced a real, non-zero estimate")
          EOF
